name: Release compiler

on:
  push:
    tags: ['compiler-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to npm. Leave false to exercise the full dry-run.
        required: false
        type: boolean
        default: false
      dry_run:
        description: Validate npm packages without publishing them.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  RUSTUP_TOOLCHAIN: '1.95.0'

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun run check:release-manifests
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish || false }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish=false
          dry_run=true
          if [ "$EVENT_NAME" = push ]; then
            version=$(node -p "require('./packages/compiler/package.json').version")
            test "$REF_NAME" = "compiler-v$version"
            publish=true
            dry_run=false
          elif [ "$INPUT_PUBLISH" = true ]; then
            publish=true
            dry_run="$INPUT_DRY_RUN"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

  build-cli:
    name: Build CLI ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            artifact: aihu-compile-darwin-arm64
            use_cross: false
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            artifact: aihu-compile-darwin-x64
            use_cross: false
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            artifact: aihu-compile-linux-x64-gnu
            use_cross: false
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            artifact: aihu-compile-linux-arm64-gnu
            use_cross: true
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            artifact: aihu-compile-win32-x64-msvc
            use_cross: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked
      - if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml
      - if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml
      - if: runner.os != 'Windows'
        run: |
          mkdir artifact
          cp target/${{ matrix.target }}/release/aihu-compile artifact/aihu-compile
          chmod 0755 artifact/aihu-compile
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aihu-compile.exe" "artifact/aihu-compile.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  build-addon:
    name: Build addon ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            cdylib: libaihu_compiler_native.dylib
            use_cross: false
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            cdylib: libaihu_compiler_native.dylib
            use_cross: false
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            cdylib: libaihu_compiler_native.so
            use_cross: false
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            cdylib: libaihu_compiler_native.so
            use_cross: true
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            cdylib: aihu_compiler_native.dll
            use_cross: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked
      - if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/compiler/src-native/Cargo.toml
      - if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/compiler/src-native/Cargo.toml
      - if: runner.os != 'Windows'
        run: |
          mkdir artifact
          cp packages/compiler/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }} artifact/aihu-compiler-native.${{ matrix.platform }}.node
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "packages/compiler/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" "artifact/aihu-compiler-native.${{ matrix.platform }}.node"
      - uses: actions/upload-artifact@v7
        with:
          name: aihu-compiler-native-${{ matrix.platform }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  publish-platforms:
    name: Pack CLI platform packages
    needs: [prepare, build-cli]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/compiler/npm/*/; do
            platform=$(basename "$dir")
            binary=artifacts/aihu-compile-$platform/aihu-compile
            if [[ "$platform" == win32-* ]]; then binary="$binary.exe"; dest="$dir/aihu-compile.exe"; else dest="$dir/aihu-compile"; fi
            test -s "$binary"
            cp "$binary" "$dest"
            [[ "$platform" == win32-* ]] || chmod 0755 "$dest"
            if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
              name=$(node -p "require('./$dir/package.json').name")
              version=$(node -p "require('./$dir/package.json').version")
              if npm view "$name@$version" version >/dev/null 2>&1; then continue; fi
              (cd "$dir" && npm publish --access public)
            else
              # `npm publish --dry-run` still consults the registry and rejects
              # an already-published version. Packing proves the artifact
              # contents without a registry-side version constraint.
              (cd "$dir" && npm pack --dry-run)
            fi
          done

  publish-addons:
    name: Pack addon platform packages
    needs: [prepare, build-addon]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/compiler/npm-native/*/; do
            platform=$(basename "$dir")
            binary=$(find "artifacts/aihu-compiler-native-$platform" -name '*.node' -type f -print -quit)
            test -n "$binary" && test -s "$binary"
            cp "$binary" "$dir/$(basename "$binary")"
            if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
              name=$(node -p "require('./$dir/package.json').name")
              version=$(node -p "require('./$dir/package.json').version")
              if npm view "$name@$version" version >/dev/null 2>&1; then continue; fi
              (cd "$dir" && npm publish --access public)
            else
              # See the CLI platform-pack step: this validates contents while
              # allowing a repeatable dry run at an already-published version.
              (cd "$dir" && npm pack --dry-run)
            fi
          done

  publish-compiler:
    name: Pack @aihu/compiler
    needs: [prepare, publish-platforms, publish-addons]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The platform packages are published by the preceding jobs. Do not
      # freeze a lockfile that predates the version being released.
      - run: bun install --ignore-scripts
      - run: bun run --cwd packages/compiler build
      - env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
            version=$(node -p "require('./packages/compiler/package.json').version")
            if npm view "@aihu/compiler@$version" version >/dev/null 2>&1; then exit 0; fi
            cd packages/compiler
            npm publish --access public
          else
            cd packages/compiler
            npm pack --dry-run
          fi
