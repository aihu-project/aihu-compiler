name: Release compiler

on:
  push:
    tags: ['compiler-v*']

permissions:
  contents: read
  id-token: write

env:
  RUSTUP_TOOLCHAIN: '1.95.0'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_USERCONFIG: /tmp/aihu-compiler-npmrc-oidc-only
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      native_release: ${{ steps.mode.outputs.native_release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.8'
      - run: bun run check:release-manifests
      - run: node scripts/release-contract-regression.mjs
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
          publish=false
          dry_run=true
          host_version=$(node -p "require('./packages/compiler/package.json').version")
          native_version=$(node -p "require('./packages/compiler/npm-native/darwin-arm64/package.json').version")
          native_release=false
          if [ "$host_version" = "$native_version" ]; then
            native_release=true
          fi
          if [ "$EVENT_NAME" = push ]; then
            test "$REF_NAME" = "compiler-v$host_version"
            test "$(git rev-parse "$REF_NAME^{commit}")" = "${{ github.sha }}"
            publish=true
            dry_run=false
          fi
          {
            echo "publish=$publish"
            echo "dry_run=$dry_run"
            echo "native_release=$native_release"
          } >> "$GITHUB_OUTPUT"
      - name: Verify reviewed merged release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/assert-reviewed-release.mjs

  build-cli:
    name: Build CLI ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.native_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            artifact: aihu-compile-darwin-arm64
            use_cross: false
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            artifact: aihu-compile-darwin-x64
            use_cross: false
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            artifact: aihu-compile-linux-x64-gnu
            use_cross: false
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            artifact: aihu-compile-linux-arm64-gnu
            use_cross: true
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            artifact: aihu-compile-win32-x64-msvc
            use_cross: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked
      - if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml
      - if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml
      - if: runner.os != 'Windows'
        run: |
          mkdir artifact
          cp target/${{ matrix.target }}/release/aihu-compile artifact/aihu-compile
          chmod 0755 artifact/aihu-compile
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aihu-compile.exe" "artifact/aihu-compile.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  build-addon:
    name: Build addon ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.native_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            cdylib: libaihu_compiler_native.dylib
            use_cross: false
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            cdylib: libaihu_compiler_native.dylib
            use_cross: false
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            cdylib: libaihu_compiler_native.so
            use_cross: false
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            cdylib: libaihu_compiler_native.so
            use_cross: true
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            cdylib: aihu_compiler_native.dll
            use_cross: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked
      - if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/compiler/src-native/Cargo.toml
      - if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/compiler/src-native/Cargo.toml
      - if: runner.os != 'Windows'
        run: |
          mkdir artifact
          cp packages/compiler/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }} artifact/aihu-compiler-native.${{ matrix.platform }}.node
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "packages/compiler/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" "artifact/aihu-compiler-native.${{ matrix.platform }}.node"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aihu-compiler-native-${{ matrix.platform }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  build-wasm:
    name: Build @aihu/compiler-wasm
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.8'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Build browser compiler
        run: bun run --cwd packages/compiler build:wasm
      - name: Enforce compressed size budget
        run: |
          set -euo pipefail
          size=$(gzip -9 -c packages/compiler/pkg-wasm/aihu_compiler_bg.wasm | wc -c)
          echo "Compressed WASM: $size bytes (budget: 512000)"
          test "$size" -le 512000
      - name: Stage npm package
        run: bun scripts/stage-wasm-package.ts artifact
      - name: Verify package contents
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/compiler-wasm-verify" node scripts/verify-pack.mjs artifact
          pack_path=$(node -e "const fs=require('node:fs'),path=require('node:path'); const d=process.argv[1]; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.tgz')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))" "$RUNNER_TEMP/compiler-wasm-verify")
          node scripts/consumer-smoke.mjs "$pack_path" artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aihu-compiler-wasm
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  publish-platforms:
    name: Pack CLI platform packages
    needs: [prepare, build-cli]
    if: needs.prepare.outputs.native_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      NPM_CONFIG_USERCONFIG: .npmrc
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - platform: linux-x64-gnu
            runner: ubuntu-22.04
          - platform: win32-x64-msvc
            runner: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - shell: bash
        run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - shell: bash
        run: npm install --global npm@11.5.1 --ignore-scripts
      - shell: bash
        run: node scripts/check-oidc-auth.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aihu-compile-${{ matrix.platform }}
          path: artifacts
      - env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          dir="packages/compiler/npm/$platform"
          binary=artifacts/aihu-compile
          if [[ "$platform" == win32-* ]]; then binary="$binary.exe"; dest="$dir/aihu-compile.exe"; else dest="$dir/aihu-compile"; fi
          test -s "$binary"
          cp "$binary" "$dest"
          [[ "$platform" == win32-* ]] || chmod 0755 "$dest"
          node scripts/assert-compiler-platform.mjs "$dir"
          pack_dir="$RUNNER_TEMP/compiler-pack-$platform"
          PACK_DIR="$pack_dir" node scripts/verify-pack.mjs "$dir"
          pack_path=$(node -e "const fs=require('node:fs'),path=require('node:path'); const d=process.argv[1]; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.tgz')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))" "$pack_dir")
          if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
            node scripts/assert-unpublished.mjs "$dir"
          fi
          node scripts/consumer-smoke.mjs "$pack_path" "$dir"
          if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
            npm publish "$pack_path" --access public --provenance --registry "$NPM_CONFIG_REGISTRY"
          fi

  publish-addons:
    name: Pack addon platform packages
    needs: [prepare, build-addon]
    if: needs.prepare.outputs.native_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      NPM_CONFIG_USERCONFIG: .npmrc
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - platform: linux-x64-gnu
            runner: ubuntu-22.04
          - platform: win32-x64-msvc
            runner: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - shell: bash
        run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - shell: bash
        run: npm install --global npm@11.5.1 --ignore-scripts
      - shell: bash
        run: node scripts/check-oidc-auth.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aihu-compiler-native-${{ matrix.platform }}
          path: artifacts
      - env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          dir="packages/compiler/npm-native/$platform"
          binary=$(node -e "const fs=require('node:fs'),path=require('node:path'); const d='artifacts'; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.node')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))")
          test -s "$binary"
          cp "$binary" "$dir/$(basename "$binary")"
          node scripts/assert-compiler-platform.mjs "$dir"
          pack_dir="$RUNNER_TEMP/compiler-native-pack-$platform"
          PACK_DIR="$pack_dir" node scripts/verify-pack.mjs "$dir"
          pack_path=$(node -e "const fs=require('node:fs'),path=require('node:path'); const d=process.argv[1]; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.tgz')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))" "$pack_dir")
          if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
            node scripts/assert-unpublished.mjs "$dir"
          fi
          node scripts/consumer-smoke.mjs "$pack_path" "$dir"
          if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
            npm publish "$pack_path" --access public --provenance --registry "$NPM_CONFIG_REGISTRY"
          fi

  publish-wasm:
    name: Pack @aihu/compiler-wasm
    needs: [prepare, build-wasm]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - run: npm install --global npm@11.5.1 --ignore-scripts
      - run: node scripts/check-oidc-auth.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aihu-compiler-wasm
          path: artifact
      - env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/compiler-wasm-pack" node scripts/verify-pack.mjs artifact
          pack_path=$(node -e "const fs=require('node:fs'),path=require('node:path'); const d=process.argv[1]; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.tgz')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))" "$RUNNER_TEMP/compiler-wasm-pack")
          node scripts/consumer-smoke.mjs "$pack_path" artifact
          if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
            node scripts/assert-unpublished.mjs artifact
            npm publish "$pack_path" --access public --provenance --registry "$NPM_CONFIG_REGISTRY"
          else
            :
          fi

  publish-compiler:
    name: Pack @aihu/compiler
    needs: [prepare, build-cli, build-addon, publish-platforms, publish-addons, publish-wasm]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.publish-wasm.result == 'success' &&
      (
        (
          needs.prepare.outputs.native_release == 'false' &&
          needs.build-cli.result == 'skipped' &&
          needs.build-addon.result == 'skipped' &&
          needs.publish-platforms.result == 'skipped' &&
          needs.publish-addons.result == 'skipped'
        ) ||
        (
          needs.prepare.outputs.native_release == 'true' &&
          needs.build-cli.result == 'success' &&
          needs.build-addon.result == 'success' &&
          needs.publish-platforms.result == 'success' &&
          needs.publish-addons.result == 'success'
        )
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - run: npm install --global npm@11.5.1 --ignore-scripts
      - run: node scripts/check-oidc-auth.mjs
      # The platform packages are published by the preceding jobs. Do not
      # freeze a lockfile that predates the version being released.
      - run: bun install --ignore-scripts
      - run: bun run --cwd packages/compiler build
      - env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ] && [ "$DRY_RUN" != true ]; then
            node scripts/assert-unpublished.mjs packages/compiler
            PACK_DIR="$RUNNER_TEMP/compiler-pack" node scripts/verify-pack.mjs packages/compiler
            pack_path=$(node -e "const fs=require('node:fs'),path=require('node:path'); const d=process.env.PACK_DIR; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.tgz')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))")
            node scripts/consumer-smoke.mjs "$pack_path" packages/compiler
            npm publish "$pack_path" --access public --provenance --registry "$NPM_CONFIG_REGISTRY"
          else
            PACK_DIR="$RUNNER_TEMP/compiler-pack" node scripts/verify-pack.mjs packages/compiler
            pack_path=$(node -e "const fs=require('node:fs'),path=require('node:path'); const d=process.argv[1]; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.tgz')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))" "$RUNNER_TEMP/compiler-pack")
            node scripts/consumer-smoke.mjs "$pack_path" packages/compiler
          fi
