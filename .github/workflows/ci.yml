name: Compiler CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.95.0"
      - run: bun install --frozen-lockfile
      # A release candidate has not published its platform packages yet.
      # Build the local compiler binary so JS integration tests exercise this
      # commit through the resolver's supported source-checkout fallback.
      - run: cargo build --release --manifest-path packages/compiler/Cargo.toml
      - run: bun run check
